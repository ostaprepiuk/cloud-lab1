services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: petfeeder
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: petfeeder_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petfeeder -d petfeeder_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://petfeeder:secretpassword@db:5432/petfeeder_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: